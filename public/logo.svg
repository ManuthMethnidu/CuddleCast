<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="logoPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>
    <linearGradient id="logoCyan" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Disc -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="22" fill="#0B132B" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="24" cy="24" r="20" fill="url(#logoPrimary)" fill-opacity="0.15" />
    <path
      d="M 12 34 C 10 24, 16 14, 25 11 C 32 8, 38 13, 38 18 C 38 23, 33 27, 28 29"
      stroke="url(#logoCyan)"
      stroke-width="3"
      stroke-linecap="round"
      filter="url(#logoGlow)"
    />
    <path
      d="M 16 36 C 22 40, 31 38, 35 33 C 39 28, 38 20, 33 16"
      stroke="url(#logoPrimary)"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.9"
    />
    <polygon points="21,17 32,24 21,31" fill="#FFFFFF" />
    <circle cx="36" cy="12" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Text: Cuddle -->
  <text x="64" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="-0.5">Cuddle</text>

  <!-- Text: Cast -->
  <text x="162" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="url(#logoCyan)" letter-spacing="-0.5">Cast</text>

  <!-- Subtitle -->
  <text x="66" y="51" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="8.5" fill="#38BDF8" opacity="0.8" letter-spacing="2">STREAM TOGETHER</text>
</svg>
