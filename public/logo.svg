<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" fill="none">
  <defs>
    <linearGradient id="echoraPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E50914" />
      <stop offset="50%" stop-color="#FF2E4D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="echoraCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#E50914" />
    </linearGradient>
    <filter id="echoraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Echora Emblem Disc -->
  <g transform="translate(6, 6)">
    <circle cx="24" cy="24" r="22" fill="#0B0D14" stroke="#27272A" stroke-width="1.5" />
    <circle cx="24" cy="24" r="20" fill="url(#echoraPrimary)" fill-opacity="0.18" />
    
    <!-- Resonance Arcs -->
    <path
      d="M 11 24 A 13 13 0 0 1 37 24"
      stroke="url(#echoraCyan)"
      stroke-width="3"
      stroke-linecap="round"
      filter="url(#echoraGlow)"
    />
    <path
      d="M 16 24 A 8 8 0 0 1 32 24"
      stroke="url(#echoraPrimary)"
      stroke-width="2.5"
      stroke-linecap="round"
      opacity="0.9"
    />
    
    <!-- Center Radiant Beacon -->
    <polygon points="21,18 31,24 21,30" fill="#FFFFFF" />
    <circle cx="24" cy="37" r="2.5" fill="#FF2E4D" />
  </g>

  <!-- Text: ECH -->
  <text x="64" y="38" font-family="'Bebas Neue', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="1.5">ECH</text>

  <!-- Text: ORA -->
  <text x="116" y="38" font-family="'Bebas Neue', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="url(#echoraPrimary)" letter-spacing="1.5">ORA</text>

  <!-- Subtitle -->
  <text x="66" y="51" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="8" fill="#A1A1AA" letter-spacing="2.5">NEXT-GEN CINEMA</text>
</svg>
